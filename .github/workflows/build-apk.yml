name: Construire l'APK Android

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    # Les 3 secrets de signature ont été créés dans l'environnement « MAGI_KEYSTORE_BASE64 » (Settings > Environments)
    environment: MAGI_KEYSTORE_BASE64
    steps:
      - uses: actions/checkout@v4

      - name: Trouver le dossier app (là où est capacitor.config.json)
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" -not -path "*/android/*" | head -1)
          if [ -z "$CFG" ]; then
            echo "::error::Dossier app/ introuvable : ajoute-le au dépôt (animecey-frontend/app avec capacitor.config.json)."
            exit 1
          fi
          APP_ABS=$(cd "$(dirname "$CFG")" && pwd)
          echo "APP_DIR=$APP_ABS" >> "$GITHUB_ENV"
          echo "Dossier trouvé : $APP_ABS"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire la page hors connexion (React, embarquée dans l'APK)
        run: |
          cd "$APP_DIR/.."
          npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts
          npm run build:offline
          if ! grep -q 'magi-offline' "$APP_DIR/www/offline.html"; then
            echo "::error::La page hors connexion embarquée n'est pas la dernière version : offline/offline.html du dépôt est ancien."
            exit 1
          fi

      - name: Installer ImageMagick (icône) et accepter les licences Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v convert || sudo ln -s "$(command -v magick)" /usr/local/bin/convert
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Clé Firebase (google-services.json, optionnelle)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$APP_DIR/google-services.json"
          fi
          if [ -f "$APP_DIR/google-services.json" ]; then echo "Firebase activé"; else echo "::warning::google-services.json absent : notifications Firebase désactivées"; fi

      - name: Clé de signature (secrets GitHub)
        env:
          KEYSTORE_BASE64: ${{ secrets.MAGI_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MAGI_KEYSTORE_PASSWORD }}
          KEY_ALIAS_IN: ${{ secrets.MAGI_KEY_ALIAS }}
          KEY_PASS_IN: ${{ secrets.MAGI_KEY_PASSWORD }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ] || [ -z "$KS_PASS" ] || [ -z "$KEY_ALIAS_IN" ]; then
            echo "::error::Secrets manquants : MAGI_KEYSTORE_BASE64, MAGI_KEYSTORE_PASSWORD, MAGI_KEY_ALIAS (et MAGI_KEY_PASSWORD si différent). Voir README."
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/magi-release.jks"
          echo "MAGI_KEYSTORE_FILE=$RUNNER_TEMP/magi-release.jks" >> "$GITHUB_ENV"
          echo "MAGI_KEYSTORE_PASSWORD=$KS_PASS" >> "$GITHUB_ENV"
          echo "MAGI_KEY_ALIAS=$KEY_ALIAS_IN" >> "$GITHUB_ENV"
          echo "MAGI_KEY_PASSWORD=${KEY_PASS_IN:-$KS_PASS}" >> "$GITHUB_ENV"
        # (MAGI_KEY_PASSWORD optionnel : s'il n'existe pas, le mot de passe du keystore est utilisé)

      - name: Installer Capacitor et créer le projet Android
        run: |
          cd "$APP_DIR"
          npm install
          npx cap add android
          python3 scripts/prepare-android.py "${{ github.run_number }}"
          npx cap sync android

      - name: Compiler l'APK (release signé)
        run: |
          cd "$APP_DIR/android"
          ./gradlew assembleRelease --no-daemon

      - name: Empreinte de la signature (doit rester identique à chaque construction)
        run: |
          keytool -printcert -jarfile "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk" | grep -E "Owner|SHA256"

      - name: Renommer l'APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/release/app-release.apk" magi-stream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: magi-stream-apk
          path: magi-stream.apk

      - name: Publier l'APK (lien stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest magi-stream.apk --title "Application Android Magi-Stream" --notes "APK construit automatiquement (build ${{ github.run_number }})."
