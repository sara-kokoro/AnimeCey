name: Construire l'APK Android

on:
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4

      - name: Trouver le dossier app (là où est capacitor.config.json)
        run: |
          CFG=$(find . -name capacitor.config.json -not -path "*/node_modules/*" -not -path "*/android/*" | head -1)
          if [ -z "$CFG" ]; then
            echo "::error::Dossier app/ introuvable : ajoute-le au dépôt (animecey-frontend/app avec capacitor.config.json)."
            exit 1
          fi
          echo "APP_DIR=$(dirname "$CFG")" >> "$GITHUB_ENV"
          echo "Dossier trouvé : $(dirname "$CFG")"

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Construire la page hors connexion (React, embarquée dans l'APK)
        run: |
          cd "$APP_DIR/.."
          npm install --no-audit --no-fund --legacy-peer-deps --ignore-scripts
          npm run build:offline
          echo "Dossier courant : $(pwd)"
          ls -la app/www || true
          if ! grep -q 'magi-offline' app/www/offline.html; then
            echo "::error::La page hors connexion embarquée n'est pas la dernière version : offline/offline.html du dépôt est ancien."
            exit 1
          fi

      - name: Installer ImageMagick (icône) et accepter les licences Android
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq imagemagick
          command -v convert || sudo ln -s "$(command -v magick)" /usr/local/bin/convert
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true

      - name: Clé Firebase (google-services.json, optionnelle)
        env:
          GOOGLE_SERVICES_JSON: ${{ secrets.GOOGLE_SERVICES_JSON }}
        run: |
          if [ -n "$GOOGLE_SERVICES_JSON" ]; then
            printf '%s' "$GOOGLE_SERVICES_JSON" > "$APP_DIR/google-services.json"
          fi
          if [ -f "$APP_DIR/google-services.json" ]; then echo "Firebase activé"; else echo "::warning::google-services.json absent : notifications Firebase désactivées"; fi

      - name: Installer Capacitor et créer le projet Android
        run: |
          cd "$APP_DIR"
          npm install
          npx cap add android
          python3 scripts/prepare-android.py "${{ github.run_number }}"
          npx cap sync android

      - name: Clé de signature
        run: |
          mkdir -p ~/.android
          cp "$APP_DIR/debug.keystore" ~/.android/debug.keystore

      - name: Compiler l'APK
        run: |
          cd "$APP_DIR/android"
          ./gradlew assembleDebug --no-daemon

      - name: Empreinte de la signature (doit rester identique à chaque construction)
        run: |
          keytool -printcert -jarfile "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" | grep -E "Owner|SHA256"

      - name: Renommer l'APK
        run: cp "$APP_DIR/android/app/build/outputs/apk/debug/app-debug.apk" magi-stream.apk

      - name: Page hors connexion réellement présente dans l'APK (diagnostic)
        run: |
          echo "--- début de assets/public/offline.html dans l'APK ---"
          unzip -p magi-stream.apk assets/public/offline.html | head -c 1500 || true
          echo
          echo "--- fichiers assets/public/ ---"
          unzip -l magi-stream.apk | grep "assets/public/" | head -20 || true

      - uses: actions/upload-artifact@v4
        with:
          name: magi-stream-apk
          path: magi-stream.apk

      - name: Publier l'APK (lien stable)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest magi-stream.apk --title "Application Android Magi-Stream" --notes "APK construit automatiquement (build ${{ github.run_number }})."
