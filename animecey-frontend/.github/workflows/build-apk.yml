name: Construire l'APK Android

on:
  workflow_dispatch: {}
  push:
    paths:
      - "app/**"
      - ".github/workflows/build-apk.yml"
      - "public/icon-512.png"

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21

      - name: Installer Capacitor
        working-directory: app
        run: npm install

      - name: Créer et préparer le projet Android
        working-directory: app
        run: |
          npx cap add android
          python3 scripts/prepare-android.py "${{ github.run_number }}"
          npx cap sync android

      - name: Clé de signature
        run: |
          mkdir -p ~/.android
          cp app/debug.keystore ~/.android/debug.keystore

      - name: Compiler l'APK
        working-directory: app/android
        run: ./gradlew assembleDebug --no-daemon

      - name: Renommer l'APK
        run: cp app/android/app/build/outputs/apk/debug/app-debug.apk magi-stream.apk

      - uses: actions/upload-artifact@v4
        with:
          name: magi-stream-apk
          path: magi-stream.apk

      - name: Publier l'APK (lien stable de téléchargement)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete apk-latest --cleanup-tag --yes || true
          gh release create apk-latest magi-stream.apk \
            --title "Application Android Magi-Stream" \
            --notes "APK construit automatiquement (build ${{ github.run_number }})."
